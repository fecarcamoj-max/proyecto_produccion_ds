<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consulta de churn</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; }
    label { display: grid; gap: .35rem; } input, select, button { padding: .65rem; font: inherit; }
    button { margin-top: 1rem; cursor: pointer; } #resultado { margin-top: 1rem; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Predicción de fuga de clientes</h1>
  <form id="form-cliente">
    <label>Antigüedad (meses)<input name="tenure" type="number" min="0" value="12" required></label>
    <label>Cargo mensual<input name="MonthlyCharges" type="number" step="0.01" value="70" required></label>
    <label>Cargos acumulados<input name="TotalCharges" type="number" step="0.01" value="840" required></label>
    <label>Adulto mayor<select name="SeniorCitizen"><option value="0">No</option><option value="1">Sí</option></select></label>
    <label>Contrato<select name="Contract"><option>Month-to-month</option><option>One year</option><option>Two year</option></select></label>
    <label>Internet<select name="InternetService"><option>Fiber optic</option><option>DSL</option><option>No</option></select></label>
    <label>Soporte técnico<select name="TechSupport"><option>No</option><option>Yes</option><option>No internet service</option></select></label>
    <label>Facturación electrónica<select name="PaperlessBilling"><option>Yes</option><option>No</option></select></label>
    <label>Forma de pago<select name="PaymentMethod"><option>Electronic check</option><option>Mailed check</option><option>Bank transfer (automatic)</option><option>Credit card (automatic)</option></select></label>
    <label>¿Tiene pareja?<select name="Partner"><option>No</option><option>Yes</option></select></label>
    <label>¿Tiene dependientes?<select name="Dependents"><option>No</option><option>Yes</option></select></label>
  </form>
  <button id="consultar" type="button">Consultar modelo</button>
  <p id="resultado" aria-live="polite"></p>
  <script src="/app.js" defer></script>
</body>
</html>
